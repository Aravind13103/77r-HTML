<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>General Bus Pass Application - Basic</title>
  <style>
    /* Beginner-friendly CSS */
    body{
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      margin: 20px;
      color: #222;
    }

    .page{
      max-width: 1000px;
      margin: 0 auto;
    }

    .header{
      background: #e6efff;
      border-radius: 30px;
      text-align: center;
      padding: 28px 20px;
      margin-bottom: 18px;
    }

    .header img{
      width: 70px;
      height: auto;
      display:block;
      margin: 0 auto 6px;
    }

    .title-large{
      color:#0837b8;
      font-weight:700;
      font-size:32px;
      letter-spacing:1px;
      margin: 6px 0;
    }

    .subtitle{
      font-size:28px;
      font-weight:700;
      margin-top:8px;
    }

    .card{
      border:1px solid #ddd;
      border-radius:6px;
      padding:16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .section-title{
      display:inline-block;
      background:#2b87c9;
      color:white;
      padding:8px 14px;
      border-radius:8px;
      font-weight:700;
      margin-top:-12px;
      margin-bottom:12px;
    }

    form{
      margin-top:8px;
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 30px; /* row gap col gap */
      align-items: start;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:600;
    }

    .input-row{
      margin-bottom:10px;
    }

    input[type="text"], input[type="email"], input[type="date"], input[type="number"], input[type="file"]{
      width:100%;
      padding:8px 10px;
      border:1px solid #bbb;
      border-radius:4px;
      box-sizing: border-box;
    }

    .small-input{
      width:80px; /* used for age boxes */
      display:inline-block;
      margin-right:8px;
    }

    .gender-row{
      margin-top:6px;
    }

    .notes{
      color: #c00;
      font-size:13px;
      margin-top:4px;
    }

    .actions{
      margin-top:14px;
      text-align:center;
    }

    button{
      background:#2b87c9;
      color:white;
      padding:10px 18px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:700;
    }

    @media (max-width:700px){
      .grid{grid-template-columns: 1fr;}
      .title-large{font-size:24px}
      .subtitle{font-size:20px}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <!-- placeholder logo -->
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAQCAYAAAB49l5ZAAAAK0lEQVR42u3NMQEAAAgDsO5f9F6hHBVJYwGQwGQwGQwGQwGQwGQwGQwGQwGQwGQwGQwH8eA3U8g0Qp7kwAAAAASUVORK5CYII=" alt="logo">
      <div class="title-large">TELANGANA STATE ROAD TRANSPORT CORPORATION</div>
      <div class="subtitle">GENERAL BUS PASS APPLICATION</div>
    </header>

    <div class="card">
      <div class="section-title">Applicant Details</div>

      <form>
        <div class="grid">
          <!-- left column -->
          <div>
            <div class="input-row">
              <label for="name">Name <span style="color:#c00">*</span></label>
              <input id="name" type="text" maxlength="20" placeholder="Enter full name">
              <div class="notes">(Maximum characters: 20)</div>
            </div>

            <div class="input-row">
              <label for="dob">Date of birth <span style="color:#c00">*</span></label>
              <input id="dob" type="date">
            </div>

            <div class="input-row">
              <label>Age As on :</label>
              <input class="small-input" type="number" min="0" placeholder="Years"> Year(s)
              <input class="small-input" type="number" min="0" placeholder="Months"> Month(s)
              <input class="small-input" type="number" min="0" placeholder="Days"> Day(s)
            </div>

            <div class="input-row">
              <label for="whatsapp">WhatsApp No <span style="color:#c00">*</span></label>
              <input id="whatsapp" type="text" placeholder="e.g. 98XXXXXXXX">
            </div>

            <div class="input-row">
              <label for="photo">Photo <span style="color:#c00">*</span></label>
              <input id="photo" type="file">
            </div>

          </div>

          <!-- right column -->
          <div>
            <div class="input-row">
              <label for="father">Father's / Guardian's Name <span style="color:#c00">*</span></label>
              <input id="father" type="text" placeholder="Father or guardian name">
            </div>

            <div class="input-row">
              <label>Gender <span style="color:#c00">*</span></label>
              <div class="gender-row">
                <label><input type="radio" name="gender" value="female"> Female</label>
                &nbsp;&nbsp;
                <label><input type="radio" name="gender" value="male"> Male</label>
              </div>
            </div>

            <div class="input-row">
              <label for="aadhaar">Aadhaar No:</label>
              <input id="aadhaar" type="text" placeholder="12 digit Aadhaar">
            </div>

            <div class="input-row">
              <label for="email">E-mail Id <span style="color:#c00">*</span></label>
              <input id="email" type="email" placeholder="you@example.com">
            </div>

          </div>
        </div>

        <div class="actions">
          <button type="submit">Submit Application</button>
        </div>
      </form>
    </div>

  </div>
</body>
</html>
